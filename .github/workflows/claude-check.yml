# 임시: Claude 연결 점검용 (확인 후 삭제)
name: claude-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g @anthropic-ai/claude-code && claude --version
      - env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "token length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "token prefix ok: $([[ $CLAUDE_CODE_OAUTH_TOKEN == sk-ant-oat* ]] && echo yes || echo no)"
          echo '안녕이라고만 답해' | claude -p --model sonnet --output-format json; echo "exit $?"
