# 임시: Claude 연결 점검용 (확인 후 삭제)
name: claude-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm install -g @anthropic-ai/claude-code
      - env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          echo "raw length: ${#RAW} / trimmed length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          printf '%s' "$RAW" | tail -c 3 | od -c | head -2
          echo '안녕이라고만 답해' | claude -p --model sonnet --output-format json | grep -o '"result":"[^"]*"'
