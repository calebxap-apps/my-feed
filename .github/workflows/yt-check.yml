# 임시: GitHub 서버에서 유튜브 자막을 받을 수 있는지 점검 (확인 후 삭제)
name: yt-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp && yt-dlp --version
      - run: |
          yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs "en.*" --sub-format vtt -o "/tmp/v" "https://www.youtube.com/watch?v=-6k3ZQslo6w" 2>&1 | tail -8
          ls -la /tmp/ | grep v\. || true
          f=$(ls /tmp/v*.vtt 2>/dev/null | head -1); [ -n "$f" ] && sed -n '1,40p' "$f" | grep -v -- '-->' | grep -v '^$' | head -20 || echo "자막 파일 없음"
