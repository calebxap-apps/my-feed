# 소식 모으기 → Claude 로 요약·번역 → 앱에 올리기 → 휴대폰 알림
#   🤖 AI·코딩:   매일 낮 12시 하루 묶음
#   📚 소설·애니: 3시간마다 확인, 새 소식이 있을 때만 올리고 알림 (유튜브 영상은 자막까지 번역)
# 정시 실행은 외부 예약 서비스(cron-job.org)가 'workflow_dispatch' 로 눌러 준다.
# 아래 GitHub 예약(schedule)은 몇 시간씩 늦게 도는 경우가 많아 '예비용'으로만 둔다.
# 같은 날 두 번 돌아도 AI·코딩은 scripts/already-done.mjs 가 막아서 한 번만 보낸다.
name: daily

on:
  schedule:
    - cron: '45 2 * * *'   # UTC 02:45 = 한국 11:45 → AI·코딩 (예비)
    - cron: '15 */3 * * *' # 3시간마다 → 소설·애니 (예비)
  workflow_dispatch: # Actions 탭에서 '지금 실행' 버튼
    inputs:
      mode:
        description: 'full = 모으기·요약·알림까지 / deploy = 화면만 올리기 / backfill = 지난 중요 영상 모아 보내기(소설·애니)'
        type: choice
        options: [full, deploy, backfill]
        default: full
      channel:
        description: '어느 채널을 돌릴까요'
        type: choice
        options: [all, ai-coding, novel-anime]
        default: all
      force:
        description: '오늘 이미 보낸 하루 묶음도 다시 만들기'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['docs/**'] # 화면 코드만 바뀌었을 땐 올리기만

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.save.outputs.changed }}
      channels: ${{ steps.pick.outputs.channels }}
    env:
      FULL: ${{ github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'backfill' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 돌릴 채널 고르기
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '45 2 * * *')   CH="ai-coding" ;;
            '15 */3 * * *') CH="novel-anime" ;;
            *) if [ "${{ inputs.mode }}" = "backfill" ]; then CH="novel-anime";
               elif [ "${{ inputs.channel }}" = "all" ] || [ -z "${{ inputs.channel }}" ]; then CH="ai-coding novel-anime";
               else CH="${{ inputs.channel }}"; fi ;;
          esac
          echo "channels=$CH" >> "$GITHUB_OUTPUT"
          echo "이번에 돌릴 채널: $CH"

      - name: Claude 설치
        if: env.FULL == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 크롬 보관함 (유튜브 자막 읽기용 브라우저를 매번 받지 않게)
        if: env.FULL == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 모으기 + 요약
        if: env.FULL == 'true'
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 복사할 때 딸려 들어간 빈칸·줄바꿈 제거
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          if [ "${{ inputs.mode }}" = "backfill" ]; then
            node scripts/backfill.mjs novel-anime
            BACKFILL=1 node scripts/summarize.mjs novel-anime
            exit 0
          fi
          for ch in ${{ steps.pick.outputs.channels }}; do
            if [ "${{ inputs.force }}" != "true" ] && node scripts/already-done.mjs "$ch"; then
              echo "[$ch] 오늘 묶음은 이미 보냈어요 — 건너뜀"; continue
            fi
            node scripts/collect.mjs "$ch"
            node scripts/transcripts.mjs "$ch" || echo "[$ch] 자막 읽기 단계 실패 — 제목만으로 계속"
            node scripts/summarize.mjs "$ch"
          done

      - name: 결과 저장
        id: save
        run: |
          if [ "$FULL" != "true" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "my-feed bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "소식: $(TZ=Asia/Seoul date '+%F %H:%M') (${{ steps.pick.outputs.channels }})"
          git pull --rebase -q && git push
          # 화면에 보이는 내용(docs)이 바뀌었을 때만 다시 올린다 (state 만 바뀐 경우 제외)
          if git diff --quiet HEAD~1 HEAD -- docs; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: 알림할 소식 넘기기
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notify
          path: tmp/*-notify.json
          if-no-files-found: ignore
          retention-days: 1

      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: needs.deploy.result == 'success' && (github.event_name == 'schedule' || inputs.mode == 'full' || inputs.mode == 'backfill')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true # 알릴 소식이 없으면 넘겨받은 파일도 없다
        with:
          name: notify
          path: tmp
      - name: 휴대폰 알림
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: |
          for ch in ${{ needs.build.outputs.channels }}; do
            node scripts/notify.mjs "$ch"
          done
